[project]
name = "selery"
version = "0.1.0"
description = "Personal market research, without execution"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pandas-ta-classic>=0.3,<1",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "arq>=0.26,<1",
  "argon2-cffi>=23,<26",
  "statsmodels>=0.14,<1",
  "webauthn>=2.2,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
ml = ["lightgbm>=4,<5", "shap>=0.47,<1", "torch>=2.6,<3", "numba>=0.64,<1"]
[tool.pytest.ini_options]
pythonpath = ["apps/api", "packages/shared/python", "packages/strategies/python"]
testpaths = ["tests"]
[tool.ruff]
line-length = 120
target-version = "py312"
